[project]
name = "bag-assistant-api"
version = "0.1.0"
description = "Multimodal bug assistant backend and Telegram bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20",
    "asyncpg>=0.29",
    "arize-phoenix>=4.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "qdrant-client>=1.14,<2",
    "llama-index",
    "llama-index-vector-stores-qdrant",
    "llama-index-readers-file",
    "openai>=2.0,<3",
    "openinference-instrumentation-openai>=0.1.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.1",
    "tenacity>=9.0",
    "diskcache>=5.6",
    "tiktoken>=0.7",
    "tqdm>=4.66",
    "uvicorn[standard]>=0.29",
    "huggingface-hub>=0.30",
    "sentence-transformers>=3.0",
    "razdel>=0.5,<0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
